# Nightly re-scan: reruns the full gate against whatever's on main, even when
# nobody has pushed. ci.yml's own weekly cron only catches drift adjacent to a
# push; this catches a new CVE or Opengrep rule landing against plugin code
# nobody has touched in weeks — the actual gap the DevSecOps review flagged.
#
# Separate grype DB cache from homelab's in-cluster one: this repo runs on
# GH-hosted ubuntu-latest (so external fork PRs keep getting free CI), which
# has no path to the internal cluster's NFS-cached DB. Same nightly cadence,
# physically separate cache — the architecture call made for this upgrade.
name: nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

# Mirrors ci.yml's pinning block deliberately — this workflow runs the same
# scanners, so leaving it on mutable tags and unverified downloads would keep
# the gap issue #29 describes open on the path that runs unattended every
# night. Keep the two blocks in step when bumping.
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  GRYPE_VERSION: "0.116.0"
  GRYPE_SHA256: "40aff724297312f91ea390d003bed8d8651c74cc7f5b26732db80b3a408d2fc5"
  OPENGREP_VERSION: "1.25.0"
  OPENGREP_SHA256: "9ac4aebb47ba3f7b0d8fc641ac8749cb6c2f253f616131a67d9631e00d4bea33"
  OPENGREP_RULES_SHA: "f1d2b562b414783763fd02a6ed2736eaed622efa"
  DAGGER_VERSION: "0.21.7"
  DAGGER_SHA256: "44430afc6f9c390fc47c4f352b15de9309a5e97ebd1ae563839617d6df8e8cc5"
  GOVULNCHECK_VERSION: "v1.1.4"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [radnr, sni_tls, probe, dynupdate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
          cache-dependency-path: ${{ matrix.plugin }}/go.sum
      - run: go test -race -covermode=atomic -coverprofile=cover.out ./...
        working-directory: ${{ matrix.plugin }}

  golangci-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [radnr, sni_tls, probe, dynupdate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
          cache-dependency-path: ${{ matrix.plugin }}/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          # MUST match ci.yml's pin, which carries the full reasoning. Short
          # version: no v1.x release builds against go.mod's toolchain, the
          # action at v9 refuses v1 outright ("golangci-lint v1 is not
          # supported by golangci-lint-action >= v7"), and .golangci.yml is in
          # the v2 schema — a v2 binary against a v1 config, or the reverse,
          # fails to load.
          #
          # This file was missed when ci.yml moved to v2 and sat on v1.62.2,
          # so every nightly run failed at "Finding needed golangci-lint
          # version" for all four plugins, before a single line was linted.
          # Nightly is the run nobody watches, which is why it went unnoticed.
          # Keep the two pins moving together.
          version: v2.13.2
          working-directory: ${{ matrix.plugin }}

  vulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [radnr, sni_tls, probe, dynupdate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
          cache-dependency-path: ${{ matrix.plugin }}/go.sum
      - run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...
        working-directory: ${{ matrix.plugin }}

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o /tmp/gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - run: gitleaks git --log-opts="--all" --redact --no-banner .

  opengrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - run: |
          set -euo pipefail
          curl -sSfL -o /tmp/opengrep \
            "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  /tmp/opengrep" | sha256sum -c -
          sudo install -m 0755 /tmp/opengrep /usr/local/bin/opengrep
          # Pinned by COMMIT: the rule set publishes no tags, and a --depth 1
          # clone of main makes a green nightly unreproducible.
          git clone --filter=blob:none --no-checkout \
            https://github.com/opengrep/opengrep-rules.git /tmp/opengrep-rules
          git -C /tmp/opengrep-rules checkout --quiet "${OPENGREP_RULES_SHA}"
      - env:
          PYTHONUTF8: "1"
          LC_ALL: "C.UTF-8"
        run: opengrep scan -f /tmp/opengrep-rules/go --error .

  sbom-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [radnr, sni_tls, probe, dynupdate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
          cache-dependency-path: ${{ matrix.plugin }}/go.sum

      # Date-keyed so same-day PR runs (which also do a sbom-scan) hit this
      # cache instead of each paying a cold `grype db update`; this nightly
      # job is what actually refreshes it once per day via `grype db update`
      # below, then re-saves the cache for the rest of the day to reuse.
      - name: Compute date key
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore/refresh grype DB cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/grype/db
          key: grype-db-${{ steps.date.outputs.today }}
          restore-keys: |
            grype-db-

      - name: Generate CycloneDX SBOM
        working-directory: ${{ matrix.plugin }}
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.7.0
          "$(go env GOPATH)/bin/cyclonedx-gomod" mod -json -output sbom.cdx.json

      - name: Install grype
        run: |
          set -euo pipefail
          url="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o /tmp/grype.tar.gz "$url"
          echo "${GRYPE_SHA256}  /tmp/grype.tar.gz" | sha256sum -c -
          tar -xzf /tmp/grype.tar.gz -C /tmp grype
          sudo install -m 0755 /tmp/grype /usr/local/bin/grype
          grype db update

      - run: grype "sbom:${{ matrix.plugin }}/sbom.cdx.json" --fail-on high

  fuzz:
    # Longer window than ci.yml's 60s push-time smoke — an actual campaign,
    # not just a check that the target still builds and runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: sni_tls/go.mod
          cache-dependency-path: sni_tls/go.sum
      - name: Fuzz SNI lookup (900s)
        working-directory: sni_tls
        run: go test -run=NONE -fuzz=FuzzGetCertificate -fuzztime=900s ./...
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: nightly-fuzz-crashers
          path: sni_tls/testdata/fuzz/

  containerize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install Dagger
        # Same release-tarball path ci.yml uses: dagger.io/install.sh 404s,
        # and piping an unverified script into a shell is the pattern this
        # hardening exists to remove.
        run: |
          set -euo pipefail
          url="https://github.com/dagger/dagger/releases/download/v${DAGGER_VERSION}/dagger_v${DAGGER_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/dagger.tar.gz "$url"
          echo "${DAGGER_SHA256}  /tmp/dagger.tar.gz" | sha256sum -c -
          tar -xzf /tmp/dagger.tar.gz -C /tmp dagger
          sudo install -m 0755 /tmp/dagger /usr/local/bin/dagger
          dagger version
      - working-directory: ci
        run: |
          set -euo pipefail
          dagger --silent call containerize \
            --source=.. --coredns-version=1.14.6 \
            export --path=../coredns-plugins.tar
          tar -tf ../coredns-plugins.tar >/dev/null

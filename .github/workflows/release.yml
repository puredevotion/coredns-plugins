# A merge to main that changes what goes into the CoreDNS image is a release:
# tag vX.Y.Z (.github/scripts/next-version.sh), build + gate the image, push it
# to ghcr.io, point homelab at it. No release PR.
#
# GitHub-hosted on purpose: this repo is public, and fork-PR code must never
# reach the LAN. homelab's Zot pulls puredevotion/coredns-plugins from ghcr.io
# on first use, so LAN DNS never depends on ghcr.io at cold start.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "sni_tls/**"
      - "radnr/**"
      - "probe/**"
      - "dynupdate/**"
      - "cookie/**"
      - "resinfo/**"
      - "zoneversion/**"
      - "geoscore/**"
      - "ci/main.go"
      - "ci/dagger.json"
      - ".github/workflows/release.yml"
      - ".github/scripts/next-version.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Upstream CoreDNS the plugins are compiled into; was hardcoded in homelab.
  COREDNS_VERSION: "1.14.7"
  DAGGER_VERSION: "0.21.12"
  DAGGER_SHA256: "1c8a2949b461c488506e5e668d6e3a0ff3b90ad588fb151f9a8fe77845bc9d7f"
  SYFT_VERSION: "1.57.2"
  SYFT_SHA256: "ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b"
  GRYPE_VERSION: "0.116.0"
  GRYPE_SHA256: "40aff724297312f91ea390d003bed8d8651c74cc7f5b26732db80b3a408d2fc5"
  IMAGE: ghcr.io/puredevotion/coredns-plugins

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the release tag
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: next version
        id: next
        run: |
          set -eu
          ver=$(sh .github/scripts/next-version.sh v 0.9.2 \
            sni_tls radnr probe dynupdate cookie resinfo zoneversion geoscore ci/main.go)
          if [ -z "$ver" ]; then
            echo "::notice::no plugin or build change since the last tag; nothing to release"
          elif [ -z "$(git tag --list "v${ver}")" ]; then
            git tag "v${ver}" "$GITHUB_SHA"
            git push origin "refs/tags/v${ver}"
            echo "::notice::tagged v${ver}"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release for the tag
      packages: write # ghcr.io/puredevotion/coredns-plugins
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DAGGER_NO_NAG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Dagger, syft, grype (pinned, checksum-verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          fetch() { # repo tag asset sha
            for attempt in 1 2 3 4 5; do
              gh release download "$2" -R "$1" -p "$3" -O "/tmp/$3" --clobber && break
              [ "$attempt" -lt 5 ] || exit 1
              sleep 15
            done
            echo "$4  /tmp/$3" | sha256sum -c -
          }
          fetch dagger/dagger "v${DAGGER_VERSION}" "dagger_v${DAGGER_VERSION}_linux_amd64.tar.gz" "$DAGGER_SHA256"
          fetch anchore/syft "v${SYFT_VERSION}" "syft_${SYFT_VERSION}_linux_amd64.tar.gz" "$SYFT_SHA256"
          fetch anchore/grype "v${GRYPE_VERSION}" "grype_${GRYPE_VERSION}_linux_amd64.tar.gz" "$GRYPE_SHA256"
          sudo tar -xzf "/tmp/dagger_v${DAGGER_VERSION}_linux_amd64.tar.gz" -C /usr/local/bin dagger
          sudo tar -xzf "/tmp/syft_${SYFT_VERSION}_linux_amd64.tar.gz" -C /usr/local/bin syft
          sudo tar -xzf "/tmp/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" -C /usr/local/bin grype
          dagger version

      - name: Test + lint the plugins the deployed image serves
        working-directory: ci
        run: |
          set -eu
          for p in sni_tls radnr probe; do
            echo "== $p =="
            dagger --silent call test-plugin --source=.. --plugin-dir="$p"
            dagger --silent call lint-plugin --source=.. --plugin-dir="$p"
          done

      - name: Build the CoreDNS image
        working-directory: ci
        run: |
          set -eu
          dagger --silent call containerize \
            --source=.. --coredns-version="$COREDNS_VERSION" \
            export --path=../coredns-plugins.tar
          tar -tf ../coredns-plugins.tar >/dev/null

      - name: SBOM + vulnerability gate (high/critical fail)
        run: |
          set -eu
          syft "oci-archive:coredns-plugins.tar" -o spdx-json=image.spdx.json
          grype "sbom:image.spdx.json" --fail-on high

      - name: Push to ghcr.io
        id: push
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -eu
          skopeo copy --digestfile digest \
            --dest-creds "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
            "oci-archive:coredns-plugins.tar" "docker://${IMAGE}:${VERSION}"
          digest=$(cat digest)
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::unexpected digest '$digest'"; exit 1 ;;
          esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### coredns-plugins ${VERSION} (CoreDNS ${COREDNS_VERSION})"
            echo
            echo "The image hivre-deploy takes (homelab, coredns_image input):"
            echo
            echo "    ${IMAGE}@${digest}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          set -eu
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          gh release upload "$TAG" --clobber image.spdx.json

  deploy:
    needs: [version, image]
    runs-on: ubuntu-latest
    steps:
      - name: mint homelab-scoped installation token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.HOMELAB_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMELAB_DISPATCH_APP_PRIVATE_KEY }}
          owner: puredevotion
          repositories: homelab
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: puredevotion/homelab
          token: ${{ steps.app.outputs.token }}
          path: .homelab
          fetch-depth: 1
          sparse-checkout: |
            k8s
            ci/release
      # OLD~NEW moves the manifests off the retired homelab-built image; a no-op once moved.
      - name: point homelab at the release
        working-directory: .homelab
        env:
          RELEASE_BOT: ${{ steps.app.outputs.app-slug }}[bot]
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          sh ci/release/deploy-image.sh "deploy(coredns-plugins): ${VERSION}" \
            "Source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}
          Run: ${RUN_URL}
          Image: ${IMAGE}:${VERSION}@${DIGEST} (CoreDNS ${COREDNS_VERSION})" \
            "zot.home.arpa/homelab/coredns-plugins~zot.home.arpa/puredevotion/coredns-plugins=${VERSION}"

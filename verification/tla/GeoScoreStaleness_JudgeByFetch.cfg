\* expect: violated NeverServeStale
\* apalache: length=8 inv=NeverServeStale
\* Freshness judged by when the plugin last READ the store, not by the
\* writer's timestamp: once the writer dies, a store that is still up keeps
\* the snapshot "fresh" forever and a dead score is served indefinitely.
CONSTANTS
    Endpoints = {"e1", "e2"}
    MaxStale = 2
    TTL = 2
    JudgeByWriter = FALSE
    CheckStaleness = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NeverServeStale FallbackOnlyWhenNoneEligible CacheExposureBound

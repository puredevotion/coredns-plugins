\* expect: violated CacheExposureBound
\* apalache: length=10 inv=CacheExposureBound
\* A TTL longer than max-staleness, which the validator refuses: every answer
\* is fresh when given, but resolvers go on serving it past twice the
\* staleness bound.
CONSTANTS
    Endpoints = {"e1", "e2"}
    MaxStale = 2
    TTL = 4
    JudgeByWriter = TRUE
    CheckStaleness = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NeverServeStale FallbackOnlyWhenNoneEligible CacheExposureBound

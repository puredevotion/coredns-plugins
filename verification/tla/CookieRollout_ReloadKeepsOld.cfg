\* expect: violated NeverVerifiesRemovedSecret
\* apalache: length=11 inv=NeverVerifiesRemovedSecret
\* Stage 3 done correctly, but the reload only adds to the verify list and
\* never removes from it, so the removed secret still verifies.
CONSTANTS
    Servers = {"s1", "s2", "s3"}
    MaxAge = 2
    StrictOrder = TRUE
    WaitWindow = TRUE
    ReloadReplaces = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoSpuriousReject NeverVerifiesRemovedSecret

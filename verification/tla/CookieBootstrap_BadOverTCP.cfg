\* expect: violated NoBadCookieOverTCP
\* apalache: length=5 inv=NoBadCookieOverTCP
\* A server that applies enforce mode over TCP too (RFC 7873 section 5.2.3
\* choice (2) over TCP): after two UDP refusals the TCP request, whose cookie
\* an inconsistent peer does not know, is refused as well.
CONSTANTS
    Mode = "enforce"
    MaxAge = 1
    MaxRestarts = 1
    MaxQueries = 1
    Inconsistent = TRUE
    BadOverTCP = TRUE
    ClientLoops = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoBadCookieOverTCP

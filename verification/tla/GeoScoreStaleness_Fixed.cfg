\* expect: pass
\* apalache: length=18 inv=TypeOK,NeverServeStale,FallbackOnlyWhenNoneEligible,CacheExposureBound slow
\* The plugin: staleness judged by the writer's own timestamp, TTL equal to
\* max-staleness (the largest the validator allows). Writer and store fail
\* and recover at any step; two endpoints.
CONSTANTS
    Endpoints = {"e1", "e2"}
    MaxStale = 2
    TTL = 2
    JudgeByWriter = TRUE
    CheckStaleness = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NeverServeStale FallbackOnlyWhenNoneEligible CacheExposureBound

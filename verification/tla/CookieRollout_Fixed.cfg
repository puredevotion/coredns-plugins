\* expect: pass
\* apalache: length=16 inv=TypeOK,NoSpuriousReject,NeverVerifiesRemovedSecret slow
\* RFC 9018 section 5 in order: all servers learn B before any generates with
\* it, and A is forgotten only after the window has passed since the last
\* switch. Three servers, window of 2 ticks.
CONSTANTS
    Servers = {"s1", "s2", "s3"}
    MaxAge = 2
    StrictOrder = TRUE
    WaitWindow = TRUE
    ReloadReplaces = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoSpuriousReject NeverVerifiesRemovedSecret

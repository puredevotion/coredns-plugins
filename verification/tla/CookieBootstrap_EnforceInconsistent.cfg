\* expect: pass
\* apalache: length=12 inv=TypeOK,NoBadCookieOverTCP,BoundedBadCookies
\* As Enforce, but the anycast set disagrees: every request may land on an
\* instance with a different secret (RFC 7873 section 5.3's "shared secrets
\* [...] inconsistent"). The retry may be refused again, TCP still answers.
CONSTANTS
    Mode = "enforce"
    MaxAge = 1
    MaxRestarts = 1
    MaxQueries = 2
    Inconsistent = TRUE
    BadOverTCP = FALSE
    ClientLoops = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoBadCookieOverTCP BoundedBadCookies
PROPERTIES EventuallyAnswered

\* expect: violated AnswerConsistent
\* apalache: length=15 inv=AnswerConsistent
\* One SOA lookup after the answer, no bracket: the zone reloads between the
\* answer and the lookup, and the old answer is advertised with the new serial.
CONSTANTS
    NumQueries = 2
    MaxChanges = 3
    Bracket = FALSE
    UseCache = TRUE
    Rollback = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK DuringQuery AnswerConsistent

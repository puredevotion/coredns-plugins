\* expect: violated SolicitationAnswered
\* apalache: length=6 inv=SolicitationAnswered
\* v0.4.1 Advertiser.Run: a periodic RA can follow a solicited one by 1s,
\* and a rate-limited RS is dropped. (RadnrRA_OriginalGap.cfg checks the
\* rate limit on its own.)
\* radnr's real timing: advInterval = 30s, so nextInterval() is in
\* [max(30/3, 3), 30] = [10, 30]; MIN_DELAY_BETWEEN_RAS = 3s.
CONSTANTS
    MinDelay = 3
    MinInterval = 10
    MaxInterval = 30
    Horizon = 70
    Fixed = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK MinGapBetweenRAs SolicitationAnswered

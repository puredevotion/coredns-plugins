\* expect: pass
\* apalache: length=15 inv=TypeOK,NoBadCookieOverTCP,BoundedBadCookies
\* Enforce mode, RFC section 5.3 client and a server that serves TCP. The
\* server restarts (new secret) twice, so a query can be refused on both UDP
\* legs and is answered on TCP.
CONSTANTS
    Mode = "enforce"
    MaxAge = 1
    MaxRestarts = 2
    MaxQueries = 2
    Inconsistent = FALSE
    BadOverTCP = FALSE
    ClientLoops = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoBadCookieOverTCP BoundedBadCookies
PROPERTIES EventuallyAnswered

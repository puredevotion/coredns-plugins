\* expect: pass
\* apalache: length=9 inv=TypeOK
\* A single consistent server that also answers BADCOOKIE over TCP, with the
\* looping client, and the secret changing at most once: the loop is NOT
\* indefinite, because the fresh cookie from each refusal is accepted at the
\* next request unless the secret changed again. It needs an inconsistent
\* anycast set (or an unbounded number of secret changes) to loop forever.
\* BoundedBadCookies is not checked here (it is not the point); the answer is.
CONSTANTS
    Mode = "enforce"
    MaxAge = 1
    MaxRestarts = 1
    MaxQueries = 1
    Inconsistent = FALSE
    BadOverTCP = TRUE
    ClientLoops = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK
PROPERTIES EventuallyAnswered

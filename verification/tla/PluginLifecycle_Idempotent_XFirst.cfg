\* expect: violated NoOrphans
\* apalache: length=4 inv=NoOrphans
\* Current OnStartup (cancels its own running goroutine first). Fixes the
\* OnRestartFailed path; still leaks through a dropped new instance
\* (startServers failure). Known residual: needs a process-wide handover, see
\* "registry".
CONSTANTS
    MaxRestarts = 3
    XFirst = TRUE
    Variant = "idempotent"
SPECIFICATION Spec
INVARIANTS TypeOK NoOrphans OnePerInstance OneInProcess CleanShutdown

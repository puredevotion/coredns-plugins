\* expect: violated EventuallyAnswered
\* apalache: skip (liveness under fairness, which Apalache does not support)
\* The "indefinite loop of retries" of RFC 7873 section 5.2.3: a query stays
\* in flight forever, UDP, UDP, TCP, UDP, UDP, TCP, ..., every one refused,
\* although the network is fair and delivers every exchange.
CONSTANTS
    Mode = "enforce"
    MaxAge = 1
    MaxRestarts = 1
    MaxQueries = 1
    Inconsistent = TRUE
    BadOverTCP = TRUE
    ClientLoops = TRUE
SPECIFICATION Spec
PROPERTIES EventuallyAnswered
